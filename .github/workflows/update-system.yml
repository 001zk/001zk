name: update-system

on:
  schedule:
    # Diariamente às 06:00 UTC (03:00 America/Sao_Paulo)
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/update-system.yml"

permissions:
  contents: write

concurrency:
  group: update-system
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch telemetry (GitHub API, dados públicos)
        env:
          GITHUB_HANDLE: 001zk
          # GITHUB_TOKEN padrão não tem acesso ao campo contributionsCollection
          # (GraphQL) — usa um PAT com escopo read:user salvo em Settings > Secrets.
          # Se TELEMETRY_TOKEN não existir, cai no GITHUB_TOKEN padrão (streak fica N/A).
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_telemetry.py

      - name: Generate SVG assets
        run: python3 scripts/generate_system.py

      - name: Generate GitHub Pages (index.html)
        run: python3 scripts/generate_web.py

      - name: Validate assets
        run: python3 scripts/validate_assets.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- assets data index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets data index.html
          git commit -m "chore: atualizar living system [skip ci]"
          git push
